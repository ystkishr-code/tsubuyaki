<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- スマホの画面幅に合わせる。これが無いとPC用の縮小表示になる -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ホーム画面に追加したときに、Safariのバーを消してアプリらしく見せる指定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="つぶやき">
<!-- ホーム画面のアイコン。iOSはこれを見つけて使う -->
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>つぶやき</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1e2228;
    --line: #2e343d;
    --text: #eef1f5;
    --muted: #8d97a5;
    --accent: #d4713c;
    --accent-dim: #6b3a1e;
    --ok: #3f8f6f;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    /* safe-area-inset = iPhoneのノッチやホームバーに隠れないための余白 */
    padding: calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 12px);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    font-size: 17px;
  }

  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { margin: 0; font-size: 1.05rem; letter-spacing: .04em; }

  /* 状態表示。録音中かどうかを目で分かるようにする */
  #status {
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--panel);
    color: var(--muted);
    font-size: .78rem;
  }
  #status.live { background: var(--accent-dim); color: #ffd9c0; }

  /* 本文欄。ここは手入力もキーボードの音声入力も使える */
  #text {
    flex: 1;
    min-height: 220px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--panel);
    color: var(--text);
    font: inherit;
    line-height: 1.7;
    resize: none;
  }
  #text:focus { outline: 2px solid var(--accent); }

  /* 認識途中の文字。確定前なので薄く出す */
  #interim {
    min-height: 1.6em;
    padding: 0 4px;
    color: var(--muted);
    font-size: .92rem;
  }

  button {
    border: 0;
    border-radius: 14px;
    color: var(--text);
    font: inherit;
    font-weight: 600;
    -webkit-appearance: none;
  }

  #mic {
    padding: 16px;
    background: var(--accent);
    font-size: 1.05rem;
  }
  #mic.on { background: #b8351f; }
  #mic:disabled { background: var(--panel); color: var(--muted); }

  /* 話すボタンの横に句読点。しゃべりながら親指で押せる位置に置く */
  .speak { display: grid; grid-template-columns: 1fr 66px 66px; gap: 8px; }
  .mark {
    border: 1px solid var(--line);
    background: var(--panel);
    font-size: 1.25rem;
  }
  .mark:active { background: var(--accent-dim); }

  .dests { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .dests button {
    padding: 14px 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    font-size: .92rem;
    font-weight: 500;
  }
  .dests button:active { background: var(--accent-dim); }
  /* 消すボタンだけは送信先ではないので、色を落として区別する */
  .dests button.danger { color: var(--muted); background: transparent; }
  .dests button.danger:active { background: #4a1f1a; color: var(--text); }

  #note { color: var(--muted); font-size: .78rem; text-align: center; min-height: 1.2em; }

</style>
</head>
<body>

<header>
  <h1>つぶやき</h1>
  <span id="status">待機中</span>
</header>

<textarea id="text" placeholder="ここに文字が入ります。マイクを押して話すか、直接打ってください。"></textarea>
<div id="interim"></div>

<div class="speak">
  <button id="mic">🎙 話す</button>
  <button id="maru" class="mark">。</button>
  <button id="ten" class="mark">、</button>
</div>

<!-- 保存先の5択。押した瞬間にObsidianへ渡す -->
<div class="dests">
  <button data-key="work-t">仕事つぶやき</button>
  <button data-key="priv-t">プライベートつぶやき</button>
  <button data-key="work-a">仕事について</button>
  <button data-key="priv-a">プライベートについて</button>
  <button data-key="plan">予定</button>
  <button id="clear" class="danger">消す</button>
</div>

<div id="note"></div>



<script>
// ============================================================
// 1. 設定 —— 5つの送り先
// ============================================================
// 保存先の定義。
//   ch     … どちらのDiscordチャンネルへ送るか（work / priv）
//   prefix … PC側のbotが振り分けに使う接頭辞。無印はつぶやき扱い。
const DESTS = {
  "work-t": { label: "仕事つぶやき",        ch: "work", prefix: ""   },
  "priv-t": { label: "プライベートつぶやき", ch: "priv", prefix: ""   },
  "work-a": { label: "仕事について",        ch: "work", prefix: "録 " },
  "priv-a": { label: "プライベートについて", ch: "priv", prefix: "録 " },
  "plan":   { label: "予定",               ch: "priv", prefix: "予 " },
};

// Discord の Webhook URL。
// このファイルは非公開の場所に置く前提で埋め込んでいる。公開の場には置かないこと。
// 万一漏れたときは、Discordの「サーバー設定 → 連携サービス → ウェブフック」で
// 当該ウェブフックを削除すれば即座に無効になる。読み取りはされない（投稿専用）。
const BASE = "https://discord.com/api/webhooks/";
const HOOKS = {
  work: BASE + "1543524520562790430" + "/" +
        "iTfrW69D0kmIwea9KUXPpMgWoJgZvh6bEkiRzBgOoPzoyFrDa_eqJgwbHXssZVowb24E",
  priv: BASE + "1543524742806380614" + "/" +
        "rFwGMrdVNphOuUdBvpPYtcofAT-TEHP0Iqwzkb9SV-MP3QYQ2Hi7VLY3NJlUfgGzkSeW",
};

function hookUrl(ch) { return HOOKS[ch] || ""; }

// ============================================================
// 2. 画面の部品を取っておく
// ============================================================
const $text    = document.getElementById("text");
const $interim = document.getElementById("interim");
const $mic     = document.getElementById("mic");
const $status  = document.getElementById("status");
const $note    = document.getElementById("note");

function say(msg) {
  $note.textContent = msg;
  setTimeout(() => { if ($note.textContent === msg) $note.textContent = ""; }, 4000);
}

// ============================================================
// 3. 句読点を足す —— 認識結果は記号を一切返さないので自分で付ける
// ============================================================
// 話し言葉は文末の形が決まっている。その形から記号を選ぶ。
//
// 問いかけで終わっている → 「？」
const ASK  = /(ですか|ますか|でしょうか|だろうか|のか|かな|かね|っけ)$/;
//
// まだ話が続く語尾。ここで切れたのは文の途中なので読点
const CONT = /(て|で|けど|けれど|けれども|ですが|ますが|だけど|ので|から|ため|し|が|たり|つつ|ながら|ものの|なら|れば|とか|には|では|とは)$/;
//
// 文の途中に出てくる、明らかな接続表現。その後ろに読点を入れる
const MID  = /(けれども|けれど|けど|ですが|ますが|だけど|なので|ので|ですから|だから|ところが|しかし|ただし|つまり|例えば|一方で)(?![、。\n])/g;

// ============================================================
// 3.5 用語辞書 —— 認識器がよく間違える語を、出てきた後で直す
// ============================================================
//
// ここに [誤り, 正しい語] を並べるだけで足せる。
// 上から順に置き換える。長い語ほど先に書くこと（短い語が先に当たると取りこぼす）。
// おかしな直り方をする行が出たら、その行を消すか、より長い言い回しにする。
// 2026-09-02、10日分の音声ノートの注記から作成。

const DICT = [
  // --- 人と役 ---
  ["カレーランカッカ", "タレーラン閣下"],
  ["タレラン閣下", "タレーラン閣下"],
  ["タレーラかっか", "タレーラン閣下"],
  ["タレラくち", "タレーランが"],
  ["他レーラー", "タレーラン"],
  ["タレーラに", "タレーランに"],
  ["タレラン", "タレーラン"],
  ["カンバセレス", "カンバセレス"],
  ["ベルティエ", "ベルティエ"],

  // --- 道具の名前 ---
  ["クロードコード", "Claude Code"],
  ["クラウドコード", "Claude Code"],
  ["ロードコード", "Claude Code"],
  ["オブシディアン", "Obsidian"],
  ["オブシリアン", "Obsidian"],
  ["オブシリア", "Obsidian"],
  ["ディスコード", "Discord"],
  ["クラウドフレア", "Cloudflare"],
  ["ジェミニン", "Gemini"],
  ["ジェミニ", "Gemini"],
  ["コードX", "Codex"],
  ["アンソロピック", "Anthropic"],

  // --- 稽古まわり ---
  ["渋る気楽", "渋る客"],
  ["絞る客", "渋る客"],
  ["シブる客", "渋る客"],
  ["クリクソン", "エリクソン"],
  ["エリクション", "エリクソン"],
  ["ベーシングの話", "ペーシングの話"],
  ["レーシング?", "ペーシング"],
  ["正可丹田", "臍下丹田"],

  // --- よく崩れる言い回し ---
  ["美即前進", "微速前進"],
  ["リスク前進", "微速前進"],
  ["瞑想しがち", "迷走しがち"],
  ["情報を入試", "情報を入手"],
  ["キーボードを売って", "キーボードを打って"],
  ["一方踏み出した", "一歩踏み出した"],
  ["べき以上の線", "べき乗の線"],
  ["変客センター", "返却センター"],
  ["つぶ焼き", "つぶやき"],
  ["うちの神様", "うちのかみさん"],
  ["歩きがない", "あとがない"],
];

// 一行ぶんの文字列に、上の辞書を順に当てる
function fixTerms(t) {
  for (const [wrong, right] of DICT) {
    if (t.includes(wrong)) t = t.split(wrong).join(right);
  }
  return t;
}

function punctuate(raw) {
  let t = raw.trim();
  if (!t) return "";
  // 1. 文の途中の接続表現に読点を入れる
  t = t.replace(MID, "$1、");

  // 2. すでに記号で終わっているならそのまま
  if (/[。、！？!?」）\n]$/.test(t)) return t;

  // 3. 語尾を見て記号を選ぶ。判定がつかないものは句点にする
  if (ASK.test(t))  return t + "？";
  if (CONT.test(t)) return t + "、";
  return t + "。";
}

// ============================================================
// 4. 音声認識 —— ブラウザが持っている機能を借りる
// ============================================================
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;      // 認識エンジン本体
let listening = false; // いま聞いている最中か
let stopWanted = false; // 自分で止めたのか、勝手に止まったのか
let pending = "";    // 話している最中に押された句読点。確定時に使う

if (!SR) {
  $mic.disabled = true;
  $mic.textContent = "音声認識が使えません";
  say("この端末では手入力を使ってください");
} else {
  rec = new SR();
  rec.lang = "ja-JP";
  rec.continuous = true;      // 一区切りで終わらせず、話し続けられるようにする
  rec.interimResults = true;  // 確定前の文字も受け取る = リアルタイム表示の正体

  // 結果が届くたびに呼ばれる
  rec.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) {
        let s = punctuate(fixTerms(t));  // 用語辞書 → 句読点 の順で直す
        // ボタンで指定された記号があれば、自動判定より優先する
        if (pending) {
          s = s.replace(/[。、？！]$/, "") + pending;
          pending = "";
        }
        $text.value += s;
        $text.scrollTop = $text.scrollHeight;
      } else {
        interim += t;  // まだ確定していない分
      }
    }
    $interim.textContent = interim + pending;
  };

  // iOSは黙っていると勝手に止まる。止めたつもりが無ければ、すぐ掛け直す
  rec.onend = () => {
    if (!stopWanted) { try { rec.start(); return; } catch (_) {} }
    listening = false;
    setMic(false);
  };

  rec.onerror = (e) => {
    if (e.error === "not-allowed") say("マイクが許可されていません");
    else if (e.error !== "no-speech") say("認識エラー: " + e.error);
  };
}

function setMic(on) {
  $mic.classList.toggle("on", on);
  $mic.textContent = on ? "■ 止める" : "🎙 話す";
  $status.classList.toggle("live", on);
  $status.textContent = on ? "聞いています" : "待機中";
  if (!on) $interim.textContent = "";
}

$mic.onclick = () => {
  if (!rec) return;
  if (listening) {
    stopWanted = true;
    rec.stop();
  } else {
    stopWanted = false;
    try { rec.start(); listening = true; setMic(true); }
    catch (_) { say("もう一度押してください"); }
  }
};

// ============================================================
// 5. Discordへ送る —— アプリを離れずに、その場で送信する
// ============================================================
// obsidian:// を使うとObsidianが前面に出てしまう。ここではDiscordへHTTPで送り、
// PC側で常駐しているbotがvaultへ書き込む。画面はこのまま動かない。
// Discordの本文は2000文字までと決まっている。超える分は切って続けて送る。
// 切る位置は、なるべく改行のところを選んで文の途中で割らないようにする。
function splitContent(text, limit = 1900) {
  const parts = [];
  let rest = text;
  while (rest.length > limit) {
    let cut = rest.lastIndexOf("\n", limit);
    if (cut < limit * 0.5) cut = limit;   // 改行が見つからなければ諦めて切る
    parts.push(rest.slice(0, cut));
    rest = rest.slice(cut);
  }
  if (rest.trim()) parts.push(rest);
  return parts;
}

async function send(key) {
  const body = $text.value.trim();
  if (!body) { say("本文が空です"); return; }

  const d = DESTS[key];
  const hook = hookUrl(d.ch);
  if (!hook) { say("送り先が未設定です"); return; }

  let text = d.prefix + body;

  const parts = splitContent(text);

  setBusy(true);
  try {
    for (const part of parts) {
      // ?wait=true を付けると、Discordが保存を終えてから返事をくれる。
      // 付けないと204が返るだけで、本当に保存されたかが分からない。
      const res = await fetch(hook + "?wait=true", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          content: part,
          // 本文に @everyone などが混ざっても通知が飛ばないようにする
          allowed_mentions: { parse: [] },
        }),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
    }

    // 送れたときだけ本文を空にする。失敗したら書いたものは残す。
    $text.value = "";
    localStorage.setItem("draft", "");
    say(parts.length > 1
      ? `${d.label} へ送りました（${parts.length}回に分けました）`
      : `${d.label} へ送りました`);
  } catch (e) {
    say("送れませんでした（本文は残しています）");
  } finally {
    setBusy(false);
  }
}

// 送信中は二重に押せないようにする
function setBusy(on) {
  document.querySelectorAll(".dests button[data-key]").forEach(b => b.disabled = on);
  $status.textContent = on ? "送信中" : (listening ? "聞いています" : "待機中");
}

document.querySelectorAll(".dests button[data-key]").forEach(b => {
  b.onclick = () => send(b.dataset.key);
});

// ============================================================
// 7. 句読点ボタン —— 話している最中でも押せる
// ============================================================
// 話している最中は、まだ文が確定していない。だからその場では本文に入れず、
// 「次に確定する分の末尾に付ける記号」として預かっておく。
// 押したことが分かるよう、確定前の薄い文字の側にだけ先に見せる。
function mark(ch) {
  if (listening) {
    pending = ch;                     // 押し直せば上書きされる
    $interim.textContent += ch;
  } else {
    $text.value += ch;                // 止まっているときはその場で足す
    $text.scrollTop = $text.scrollHeight;
  }
}

document.getElementById("maru").onclick = () => mark("。");
document.getElementById("ten").onclick  = () => mark("、");

// ============================================================
// 8. 消す
// ============================================================
document.getElementById("clear").onclick = () => {
  if ($text.value && confirm("消しますか")) { $text.value = ""; $interim.textContent = ""; }
};

// 書きかけを端末に残しておく。閉じても消えないように
$text.value = localStorage.getItem("draft") || "";
setInterval(() => localStorage.setItem("draft", $text.value), 1000);
</script>
</body>
</html>
